name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run seed
      - run: npm run build -w @culturepulse/app
      - run: npm run build -w @culturepulse/admin
      - name: Typecheck API
        run: npx tsc -p services/api/tsconfig.json --noEmit
