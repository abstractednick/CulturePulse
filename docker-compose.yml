services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: culturepulse-dev-secret-change-in-production
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 8

  jobs:
    build:
      context: .
      dockerfile: services/jobs/Dockerfile
    environment:
      JOBS_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: web/app/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: web/admin-panel/Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - api
